<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c2c2a">
  <script>
    let savedTheme
    try { savedTheme = localStorage.getItem('ggeTheme') } catch {}
    document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
      ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GGEトラッカー">
  <link rel="icon" href="/pwa-192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>要塞・ドラゴン トラッカー</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
